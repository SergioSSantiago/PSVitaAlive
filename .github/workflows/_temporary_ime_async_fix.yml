name: Temporary Async IME Repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary_ime_async_fix.yml'
      - 'scripts/_temporary_ime_async_fix.py'

permissions:
  contents: write

jobs:
  patch-ime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/_temporary_ime_async_fix.py

      - name: Verify diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -n "class ImeController" 'Client PSVitaAlive/source/main.cpp'
          grep -n "setExternalInputBlocked" 'Client PSVitaAlive/source/main.cpp' 'Client PSVitaAlive/include/ui/full_catalog_screen.hpp'
          grep -n "completeSearch" 'Client PSVitaAlive/source/main.cpp' 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
          grep -n "finishFrameWithCommonDialog" 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'

      - name: Commit fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_temporary_ime_async_fix.yml scripts/_temporary_ime_async_fix.py
          git add 'Client PSVitaAlive/source/main.cpp' \
                  'Client PSVitaAlive/include/ui/full_catalog_screen.hpp' \
                  'Client PSVitaAlive/source/ui/full_catalog_screen.cpp' \
                  '.github/workflows/_temporary_ime_async_fix.yml' \
                  'scripts/_temporary_ime_async_fix.py'
          git diff --cached --check
          git commit -m 'fix(client): make search IME lifecycle asynchronous and repeat-safe'
          git push origin HEAD:main
