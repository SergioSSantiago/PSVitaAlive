name: Apply update badge clipping fix once

on:
  push:
    paths:
      - '.github/workflows/apply-update-badge-clip-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch catalog update badge clipping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          hpp_path = Path('Client PSVitaAlive/include/ui/full_catalog_screen.hpp')
          cpp_path = Path('Client PSVitaAlive/source/ui/full_catalog_screen.cpp')

          hpp = hpp_path.read_text(encoding='utf-8')
          cpp = cpp_path.read_text(encoding='utf-8')

          hpp = replace_once(
              hpp,
              '    void drawInstallBadge(int x, int y, const LocalInstallInfo& info, bool compact);',
              '    void drawInstallBadge(int x, int y, const LocalInstallInfo& info, bool compact,\n'
              '                          int clipLeft, int clipTop, int clipRight, int clipBottom);',
              'header drawInstallBadge declaration')

          cpp = replace_once(
              cpp,
              'void FullCatalogScreen::drawInstallBadge(int x, int y, const LocalInstallInfo& info, bool compact) {',
              'void FullCatalogScreen::drawInstallBadge(int x, int y, const LocalInstallInfo& info, bool compact,\n'
              '                                               int clipLeft, int clipTop, int clipRight, int clipBottom) {',
              'drawInstallBadge definition')

          cpp = replace_once(
              cpp,
              '    const int innerW = std::max(8, bw - padX * 2);\n\n'
              '    // The update badge never disappears: only its outer glow breathes softly.',
              '    const int innerW = std::max(8, bw - padX * 2);\n\n'
              '    // Badge rendering owns a temporary scissor, but it must never widen the\n'
              '    // card/panel clip supplied by the caller. This matters while a card is\n'
              '    // partially entering/leaving the catalog viewport during smooth scroll.\n'
              '    const int drawClipL = std::max(x - 1, clipLeft);\n'
              '    const int drawClipT = std::max(y - 1, clipTop);\n'
              '    const int drawClipR = std::min(x + bw + 1, clipRight);\n'
              '    const int drawClipB = std::min(y + bh + 1, clipBottom);\n'
              '    if (drawClipR <= drawClipL || drawClipB <= drawClipT) return;\n'
              '    vita2d_enable_clipping();\n'
              '    vita2d_set_clip_rectangle(drawClipL, drawClipT, drawClipR, drawClipB);\n\n'
              '    // The update badge never disappears: only its outer glow breathes softly.',
              'badge clip setup')

          cpp = replace_once(
              cpp,
              '        drawMarqueeText(&font_, x + padX, baselineY, innerW, fg, scale, label, true,\n'
              '                        x + padX, y, x + bw - padX, y + bh);',
              '        drawMarqueeText(&font_, x + padX, baselineY, innerW, fg, scale, label, true,\n'
              '                        std::max(x + padX, clipLeft), std::max(y, clipTop),\n'
              '                        std::min(x + bw - padX, clipRight), std::min(y + bh, clipBottom));',
              'badge marquee parent clip')

          cpp = replace_once(
              cpp,
              '    } else {\n'
              '        // Long translations scroll inside the badge instead of covering card metadata.\n'
              '        drawMarqueeText(&font_, x + padX, baselineY, innerW, fg, scale, label, true,\n'
              '                        std::max(x + padX, clipLeft), std::max(y, clipTop),\n'
              '                        std::min(x + bw - padX, clipRight), std::min(y + bh, clipBottom));\n'
              '    }\n'
              '}\n\n'
              'void FullCatalogScreen::drawCatalogCard',
              '    } else {\n'
              '        // Long translations scroll inside the badge instead of covering card metadata.\n'
              '        drawMarqueeText(&font_, x + padX, baselineY, innerW, fg, scale, label, true,\n'
              '                        std::max(x + padX, clipLeft), std::max(y, clipTop),\n'
              '                        std::min(x + bw - padX, clipRight), std::min(y + bh, clipBottom));\n'
              '    }\n\n'
              '    // drawMarqueeText temporarily tightens the scissor. Always restore the\n'
              '    // caller-owned card/detail clip before returning.\n'
              '    vita2d_enable_clipping();\n'
              '    vita2d_set_clip_rectangle(clipLeft, clipTop, clipRight, clipBottom);\n'
              '}\n\n'
              'void FullCatalogScreen::drawCatalogCard',
              'badge clip restore')

          cpp = replace_once(
              cpp,
              '        drawInstallBadge(x + ox + ww - cardInstallBadgeW - 6, y + oy + 6, cardInstall, compact);',
              '        drawInstallBadge(x + ox + ww - cardInstallBadgeW - 6, y + oy + 6, cardInstall, compact,\n'
              '                         std::max(x + ox, clipL), std::max(y + oy, clipT),\n'
              '                         std::min(x + ox + ww, clipR), std::min(y + oy + hh, clipB));',
              'catalog-card badge call')

          cpp = replace_once(
              cpp,
              '            drawInstallBadge(x + w - bw - 10, y + 12, li, false);',
              '            drawInstallBadge(x + w - bw - 10, y + 12, li, false,\n'
              '                             x, y, x + w, y + h);',
              'detail-panel badge call')

          # Keep the patch deliberately narrow: definition + two call sites only.
          if cpp.count('drawInstallBadge(') != 3:
              raise SystemExit(f"unexpected drawInstallBadge occurrence count: {cpp.count('drawInstallBadge(')}")

          hpp_path.write_text(hpp, encoding='utf-8')
          cpp_path.write_text(cpp, encoding='utf-8')
          print('Update badge clipping patch applied successfully')
          PY

      - name: Commit patch to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Client PSVitaAlive/include/ui/full_catalog_screen.hpp' 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Clip update badge marquee to catalog panel"
          git push origin HEAD:main
