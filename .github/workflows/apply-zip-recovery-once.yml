          rp = Path('README.md')
          root = rp.read_text(encoding='utf-8')
          bullet = '- Install: **VPK** (including nested `.vpk` inside a release ZIP), **ZIP** extract (`extract_path` or quick paths; large / >2 GB archives; EOCD/ZIP64 retries), licensed **Vita PKG** via system **BGDL**, **PSP/PS1 PKG** via BGDL (LiveArea) or **Adrenaline unpack** (Folder/ISO via pkg2zip-style pipeline)\n'
          if bullet in root and 'Manual ZIP recovery' not in root:
              root = root.replace(bullet, bullet + '- **Manual ZIP recovery on extraction failure:** a fully downloaded data ZIP can be kept under `ux0:data/psvitaalive/manual/<title_id-or-app_id>/` for manual extraction, or explicitly deleted; direct VPK failures keep their existing cleanup path\n', 1)
          rp.write_text(root, encoding='utf-8')

          # ------------------------------------------------------------------
          # Static validation before commit
          # ------------------------------------------------------------------
          checks = {
            hp: ['resolveZipRecovery(bool keep)', 'zipRecoveryAvailable'],
            cp: ['ZIP recovery available path=', 'zipRecoveryCandidate', 'ZIP manual recovery'],
            uhp: ['InstallZipRecoveryFn', 'zipRecoveryAvailable = false'],
            ucp: ['ZIP_RECOVERY_TITLE', 'installZipRecoveryAvailable_'],
            mp: ['setInstallZipRecoveryCallback', 'cur.zipRecoveryAvailable'],
            'docs/DOWNLOAD_RESILIENCE.md': ['Manual ZIP recovery after extraction failure'],
          }
          for p, needles in checks.items():
              t = read(p)
              for needle in needles:
                  if needle not in t: raise SystemExit(f'{p}: validation missing {needle}')

          # Ensure the feature cannot accidentally classify direct VPKs solely by suffix.
          cc = read(cp)
          expected_guard = 'downloadedPayload.format == FileFormat::Zip && !activeZipDestination_.empty()'
          if expected_guard not in cc:
              raise SystemExit('ZIP-only guard missing')

          print('ZIP recovery patch staged successfully')
          PY

