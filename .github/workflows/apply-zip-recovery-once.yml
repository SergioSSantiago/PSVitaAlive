name: Apply ZIP extraction recovery once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-zip-recovery-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ZIP-only manual recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')
          def repl(s, old, new, label, count=1):
              n = s.count(old)
              if n < count:
                  raise SystemExit(f'{label}: anchor not found (have {n}, need {count})')
              return s.replace(old, new, count)

          # ------------------------------------------------------------------
          # InstallController public/status state
          # ------------------------------------------------------------------
          hp = 'Client PSVitaAlive/include/installer/install_controller.hpp'
          h = read(hp)
          h = repl(h,
          '''    bool needsReboot = false;\n''',
          '''    bool needsReboot = false;\n    /** True only when a fully downloaded data ZIP failed during extraction. */\n    bool zipRecoveryAvailable = false;\n    bool zipRecoveryMayBeCorrupt = false;\n    std::string zipRecoveryPath;\n    std::string zipRecoveryExtractPath;\n''', 'controller status fields')
          h = repl(h,
          '''    void acknowledgeResult();\n    InstallStatus status() const;\n''',
          '''    void acknowledgeResult();\n    /** Resolve a pending ZIP extraction recovery. keep=true preserves it; false deletes it. */\n    bool resolveZipRecovery(bool keep);\n    InstallStatus status() const;\n''', 'controller recovery method')
          h = repl(h,
          '''    void setPendingCatalogMeta(const std::string& appId, const std::string& version,\n                               const std::string& versionDate = std::string(), int revision = 0);\n''',
          '''    void setPendingCatalogMeta(const std::string& appId, const std::string& version,\n                               const std::string& versionDate = std::string(), int revision = 0,\n                               const std::string& titleId = std::string());\n''', 'controller pending meta signature')
          h = repl(h,
          '''    int pendingReleaseRevision_ = 0;\n''',
          '''    int pendingReleaseRevision_ = 0;\n    std::string pendingTitleId_;\n''', 'controller pending title')
          h = repl(h,
          '''    std::string activePluginLine_;\n    std::atomic<bool> needsReboot_{false};\n''',
          '''    std::string activePluginLine_;\n    std::string activeDisplayTitle_;\n    std::atomic<bool> needsReboot_{false};\n\n    // ZIP-only manual recovery. This is never populated for direct VPK/PKG/plugin jobs.\n    std::atomic<bool> zipRecoveryAvailable_{false};\n    std::atomic<bool> zipRecoveryMayBeCorrupt_{false};\n    std::string zipRecoveryPath_;\n    std::string zipRecoveryInfoPath_;\n    std::string zipRecoveryExtractPath_;\n    std::string zipRecoveryJobId_; // non-empty only if rename out of the job dir failed\n''', 'controller recovery members')
          write(hp, h)

          cp = 'Client PSVitaAlive/source/installer/install_controller.cpp'
          c = read(cp)

          helper_anchor = '''constexpr uint64_t RESULT_AUTO_DISMISS_MS = 8000;\n}\n'''
          helpers = r'''constexpr uint64_t RESULT_AUTO_DISMISS_MS = 8000;

bool looksLikeDamagedZipError(const std::string& e) {
    static const char* needles[] = {
        "CRC", "crc", "compressed data", "data error", "unexpected end",
        "premature", "truncated", "incomplete", "EOCD", "ZIP64",
        "size mismatch after extract", "size mismatch after download"
    };
    for (const char* n : needles) if (e.find(n) != std::string::npos) return true;
    return false;
}

std::string sanitizeRecoveryComponent(const std::string& input, const char* fallback) {
    std::string out;
    out.reserve(input.size());
    for (unsigned char uc : input) {
        const char ch = static_cast<char>(uc);
        if (uc < 32 || ch == '/' || ch == '\\' || ch == ':') {
            if (!out.empty() && out.back() != '_') out.push_back('_');
            continue;
        }
        out.push_back(ch);
    }
    while (!out.empty() && (out.back() == ' ' || out.back() == '.')) out.pop_back();
    while (!out.empty() && out.front() == ' ') out.erase(out.begin());
    if (out.empty()) out = fallback ? fallback : "unknown";
    if (out.size() > 96) out.resize(96);
    return out;
}

std::string uniqueRecoveryPath(StorageManager& st, const std::string& dir, const std::string& fileName) {
    const std::string safe = sanitizeRecoveryComponent(fileName, "archive.zip");
    std::string candidate = dir + "/" + safe;
    if (!st.exists(candidate)) return candidate;
    const size_t dot = safe.find_last_of('.');
    const std::string stem = (dot == std::string::npos) ? safe : safe.substr(0, dot);
    const std::string ext = (dot == std::string::npos) ? std::string() : safe.substr(dot);
    for (int i = 2; i <= 999; ++i) {
        candidate = dir + "/" + stem + " (" + std::to_string(i) + ")" + ext;
        if (!st.exists(candidate)) return candidate;
    }
    return dir + "/" + stem + "_recovered" + ext;
}
}
'''
          c = repl(c, helper_anchor, helpers, 'controller helpers')

          c = repl(c,
          '''void InstallController::acknowledgeResult() {\n    const auto s = static_cast<InstallStatus::State>(state_.load());\n    if (s != InstallStatus::State::Completed && s != InstallStatus::State::Failed\n        && s != InstallStatus::State::Cancelled) return;\n    diagnostics::log("[Installer] result acknowledged by UI");\n''',
          '''void InstallController::acknowledgeResult() {\n    const auto s = static_cast<InstallStatus::State>(state_.load());\n    if (s != InstallStatus::State::Completed && s != InstallStatus::State::Failed\n        && s != InstallStatus::State::Cancelled) return;\n    // A recovered ZIP needs an explicit Keep/Delete decision. Do not let a generic\n    // close path accidentally leave a multi-GB file or erase it without consent.\n    if (zipRecoveryAvailable_.load()) {\n        diagnostics::log("[Installer] result acknowledge ignored: ZIP recovery decision pending");\n        return;\n    }\n    diagnostics::log("[Installer] result acknowledged by UI");\n''', 'acknowledge guard')
          c = repl(c,
          '''    setInstallPath("");\n    setTitleId("");\n    setStage("Idle");\n''',
          '''    setInstallPath("");\n    setTitleId("");\n    zipRecoveryAvailable_.store(false);\n    zipRecoveryMayBeCorrupt_.store(false);\n    zipRecoveryPath_.clear();\n    zipRecoveryInfoPath_.clear();\n    zipRecoveryExtractPath_.clear();\n    zipRecoveryJobId_.clear();\n    setStage("Idle");\n''', 'acknowledge clear recovery', 1)

          # Insert resolver immediately before busy().
          busy_anchor = '''bool InstallController::busy() const {\n'''
          resolver = r'''bool InstallController::resolveZipRecovery(bool keep) {
    if (!zipRecoveryAvailable_.load()) return false;
    if (static_cast<InstallStatus::State>(state_.load()) != InstallStatus::State::Failed) return false;

    StorageManager st;
    if (keep) {
        if (!zipRecoveryPath_.empty() && !st.exists(zipRecoveryPath_)) {
            setMessage(::psvitaalive::L("ZIP_RECOVERY_KEEP_FAILED"));
            diagnostics::log("[Installer] ZIP recovery keep failed: archive missing at " + zipRecoveryPath_);
            return false;
        }
        diagnostics::log("[Installer] ZIP recovery action=kept path=" + zipRecoveryPath_);
        // If the fallback still lives in the completed job directory, leave that
        // completed job intact. Normal startup cleanup preserves completed jobs.
        zipRecoveryJobId_.clear();
    } else {
        bool ok = true;
        if (!zipRecoveryJobId_.empty()) {
            ok = downloads_.cleanupCompletedJob(zipRecoveryJobId_);
        } else if (!zipRecoveryPath_.empty() && st.exists(zipRecoveryPath_)) {
            ok = st.removeFile(zipRecoveryPath_);
        }
        if (ok && !zipRecoveryInfoPath_.empty() && st.exists(zipRecoveryInfoPath_))
            st.removeFile(zipRecoveryInfoPath_);
        if (!ok) {
            setMessage(::psvitaalive::L("ZIP_RECOVERY_DELETE_FAILED"));
            diagnostics::log("[Installer] ZIP recovery delete failed path=" + zipRecoveryPath_);
            return false;
        }
        diagnostics::log("[Installer] ZIP recovery action=deleted path=" + zipRecoveryPath_);
    }

    zipRecoveryAvailable_.store(false);
    zipRecoveryMayBeCorrupt_.store(false);
    zipRecoveryJobId_.clear();
    acknowledgeResult();
    return true;
}

'''
          c = repl(c, busy_anchor, resolver + busy_anchor, 'resolver insert')

          c = repl(c,
          '''void InstallController::setPendingCatalogMeta(const std::string& appId, const std::string& version,\n                                                   const std::string& versionDate, int revision) {\n    pendingAppId_ = appId;\n    pendingCatalogVersion_ = version;\n    pendingVersionDate_ = versionDate;\n    pendingReleaseRevision_ = revision;\n}\n''',
          '''void InstallController::setPendingCatalogMeta(const std::string& appId, const std::string& version,\n                                                   const std::string& versionDate, int revision,\n                                                   const std::string& titleId) {\n    pendingAppId_ = appId;\n    pendingCatalogVersion_ = version;\n    pendingVersionDate_ = versionDate;\n    pendingReleaseRevision_ = revision;\n    pendingTitleId_ = titleId;\n}\n''', 'pending meta implementation')

          # Reset recovery state at start of a new accepted direct job.
          c = repl(c,
          '''    activeJobId_ = jobId;\n    activeZipDestination_ = zipDestination;\n    activeFileName_ = fileName;\n''',
          '''    activeJobId_ = jobId;\n    activeZipDestination_ = zipDestination;\n    activeFileName_ = fileName;\n    activeDisplayTitle_ = niceTitle;\n    zipRecoveryAvailable_.store(false);\n    zipRecoveryMayBeCorrupt_.store(false);\n    zipRecoveryPath_.clear();\n    zipRecoveryInfoPath_.clear();\n    zipRecoveryExtractPath_.clear();\n    zipRecoveryJobId_.clear();\n''', 'request recovery reset')

          # Status exposure.
          c = repl(c,
          '''    result.needsReboot = needsReboot_.load();\n    result.resultAutoCloseRemainingMs = 0;\n''',
          '''    result.needsReboot = needsReboot_.load();\n    result.zipRecoveryAvailable = zipRecoveryAvailable_.load();\n    result.zipRecoveryMayBeCorrupt = zipRecoveryMayBeCorrupt_.load();\n    if (result.zipRecoveryAvailable) {\n        result.zipRecoveryPath = zipRecoveryPath_;\n        result.zipRecoveryExtractPath = zipRecoveryExtractPath_;\n    }\n    result.resultAutoCloseRemainingMs = 0;\n''', 'status recovery exposure')

          # Detect the downloaded outer payload once. Recovery is ONLY for a real ZIP
          # with an explicit extraction destination; direct VPK and ZIP-as-VPK are excluded.
          c = repl(c,
          '''    std::string directRifPath;\n    {\n        FormatDetector det;\n        const DetectResult dr = det.detectFile(job->finalPath);\n        const std::string ext = FormatDetector::extensionOf(job->finalPath);\n''',
          '''    FormatDetector payloadDetector;\n    const DetectResult downloadedPayload = payloadDetector.detectFile(job->finalPath);\n    const bool zipRecoveryCandidate =\n        downloadedPayload.format == FileFormat::Zip && !activeZipDestination_.empty();\n    diagnostics::log(std::string("[Installer] ZIP recovery candidate=") +\n        (zipRecoveryCandidate ? "yes" : "no") +\n        " format=" + toString(downloadedPayload.format) +\n        " extract_path=" + (activeZipDestination_.empty() ? "-" : activeZipDestination_));\n\n    std::string directRifPath;\n    {\n        const DetectResult& dr = downloadedPayload;\n        const std::string ext = FormatDetector::extensionOf(job->finalPath);\n''', 'payload ZIP detection')

          # Reuse corruption helper in retry policy.
          corrupt_old = '''        const bool corruptArchive =\n            lastInstallError.find("CRC") != std::string::npos ||\n            lastInstallError.find("crc") != std::string::npos ||\n            lastInstallError.find("compressed data") != std::string::npos ||\n            lastInstallError.find("data error") != std::string::npos ||\n            lastInstallError.find("unexpected end") != std::string::npos ||\n            lastInstallError.find("premature") != std::string::npos ||\n            lastInstallError.find("truncated") != std::string::npos ||\n            lastInstallError.find("Unsupported compression") != std::string::npos ||\n            lastInstallError.find("unsupported compression") != std::string::npos ||\n            lastInstallError.find("encryption") != std::string::npos ||\n            lastInstallError.find("size mismatch after extract") != std::string::npos ||\n            lastInstallError.find("size mismatch after download") != std::string::npos;\n'''
          corrupt_new = '''        const bool corruptArchive = looksLikeDamagedZipError(lastInstallError) ||\n            lastInstallError.find("Unsupported compression") != std::string::npos ||\n            lastInstallError.find("unsupported compression") != std::string::npos ||\n            lastInstallError.find("encryption") != std::string::npos;\n'''
          c = repl(c, corrupt_old, corrupt_new, 'corruption helper use')

          # Replace only the final post-download install/extract failure cleanup.
          fail_old = '''        diagnostics::log(std::string("[Installer] ") + (cancelled ? "installation cancelled: " : "installation failed: ") + error +\n            " attempts=" + std::to_string(attemptsUsed));\n        downloads_.cleanupCompletedJob(activeJobId_);\n        activeJobId_.clear();\n        resultShownAtMs_.store(sceKernelGetSystemTimeWide() / 1000ULL);\n'''
          fail_new = r'''        diagnostics::log(std::string("[Installer] ") + (cancelled ? "installation cancelled: " : "installation failed: ") + error +
            " attempts=" + std::to_string(attemptsUsed));

        // Manual recovery is intentionally ZIP-only. A completed data ZIP that
        // failed in the extraction phase is valuable user data; direct VPK/PKG,
        // plugin jobs, cancellations and incomplete network downloads keep their
        // existing cleanup behavior.
        if (!cancelled && zipRecoveryCandidate) {
            StorageManager st;
            const std::string key = sanitizeRecoveryComponent(
                !pendingTitleId_.empty() ? pendingTitleId_ : pendingAppId_, "unknown");
            const std::string recoveryDir = std::string(StorageManager::BASE_DIR) + "/manual/" + key;
            const bool dirOk = st.createDirectories(recoveryDir);
            std::string recoveryPath = job->finalPath;
            bool movedOut = false;
            if (dirOk) {
                const std::string candidate = uniqueRecoveryPath(st, recoveryDir, job->fileName);
                if (st.rename(job->finalPath, candidate)) {
                    recoveryPath = candidate;
                    movedOut = true;
                }
            }

            zipRecoveryPath_ = recoveryPath;
            zipRecoveryExtractPath_ = activeZipDestination_;
            zipRecoveryMayBeCorrupt_.store(looksLikeDamagedZipError(error));
            zipRecoveryJobId_ = movedOut ? std::string() : activeJobId_;
            zipRecoveryInfoPath_.clear();

            if (movedOut) {
                const std::string infoPath = recoveryPath + ".info.txt";
                std::string info;
                info += "PS Vita Alive Store - ZIP manual recovery\n\n";
                info += "App: " + (activeDisplayTitle_.empty() ? pendingAppId_ : activeDisplayTitle_) + "\n";
                info += "App ID: " + (pendingAppId_.empty() ? std::string("-") : pendingAppId_) + "\n";
                info += "Title ID: " + (pendingTitleId_.empty() ? std::string("-") : pendingTitleId_) + "\n";
                info += "Archive: " + job->fileName + "\n";
                info += "Saved path: " + recoveryPath + "\n";
                info += "Manual extraction target: " + activeZipDestination_ + "\n";
                info += "Automatic extraction error: " + error + "\n";
                if (zipRecoveryMayBeCorrupt_.load())
                    info += "Warning: archive may be damaged/incomplete; manual extraction may also fail.\n";
                if (st.writeTextFile(infoPath, info)) zipRecoveryInfoPath_ = infoPath;

                // The archive is now outside the job directory, so normal job
                // metadata/temp cleanup cannot erase the preserved ZIP.
                downloads_.cleanupCompletedJob(activeJobId_);
                activeJobId_.clear();
            } else {
                diagnostics::log("[Installer] ZIP recovery rename failed; keeping completed job payload in place");
            }

            zipRecoveryAvailable_.store(true);
            setStage("ZipRecovery");
            setInstallPath(activeZipDestination_.c_str());
            diagnostics::log(std::string("[Installer] ZIP recovery available path=") + recoveryPath +
                " target=" + activeZipDestination_ +
                " may_be_corrupt=" + (zipRecoveryMayBeCorrupt_.load() ? "yes" : "no"));
        } else {
            downloads_.cleanupCompletedJob(activeJobId_);
            activeJobId_.clear();
        }
        resultShownAtMs_.store(sceKernelGetSystemTimeWide() / 1000ULL);
'''
          c = repl(c, fail_old, fail_new, 'final failure recovery')
          write(cp, c)

          # ------------------------------------------------------------------
          # UI API/state
          # ------------------------------------------------------------------
          uhp = 'Client PSVitaAlive/include/ui/full_catalog_screen.hpp'
          uh = read(uhp)
          uh = repl(uh,
          '''    using InstallAcknowledgeFn = std::function<void()>;\n''',
          '''    using InstallAcknowledgeFn = std::function<void()>;\n    using InstallZipRecoveryFn = std::function<bool(bool keep)>;\n''', 'ui callback type')
          uh = repl(uh,
          '''    void setInstallAcknowledgeCallback(InstallAcknowledgeFn callback);\n''',
          '''    void setInstallAcknowledgeCallback(InstallAcknowledgeFn callback);\n    void setInstallZipRecoveryCallback(InstallZipRecoveryFn callback) { installZipRecovery_ = callback; }\n''', 'ui callback setter')
          uh = repl(uh,
          '''                            uint64_t resultAutoCloseRemainingMs = 0,\n                            bool needsReboot = false);\n''',
          '''                            uint64_t resultAutoCloseRemainingMs = 0,\n                            bool needsReboot = false,\n                            bool zipRecoveryAvailable = false,\n                            const std::string& zipRecoveryPath = std::string(),\n                            const std::string& zipRecoveryExtractPath = std::string(),\n                            bool zipRecoveryMayBeCorrupt = false);\n''', 'ui progress signature')
          uh = repl(uh,
          '''    InstallAcknowledgeFn installAcknowledge_;\n''',
          '''    InstallAcknowledgeFn installAcknowledge_;\n    InstallZipRecoveryFn installZipRecovery_;\n''', 'ui callback member')
          uh = repl(uh,
          '''    std::string installResultTitleId_;\n''',
          '''    std::string installResultTitleId_;\n    bool installZipRecoveryAvailable_ = false;\n    bool installZipRecoveryMayBeCorrupt_ = false;\n    std::string installZipRecoveryPath_;\n    std::string installZipRecoveryExtractPath_;\n''', 'ui recovery state')
          write(uhp, uh)

          ucp = 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
          u = read(ucp)
          u = repl(u,
          '''    uint64_t resultAutoCloseRemainingMs,\n    bool needsReboot)\n{\n''',
          '''    uint64_t resultAutoCloseRemainingMs,\n    bool needsReboot,\n    bool zipRecoveryAvailable,\n    const std::string& zipRecoveryPath,\n    const std::string& zipRecoveryExtractPath,\n    bool zipRecoveryMayBeCorrupt)\n{\n''', 'ui progress implementation signature')
          u = repl(u,
          '''    installResultPath_ = installPath;\n    installResultTitleId_ = titleId;\n''',
          '''    installResultPath_ = installPath;\n    installResultTitleId_ = titleId;\n    installZipRecoveryAvailable_ = zipRecoveryAvailable;\n    installZipRecoveryPath_ = zipRecoveryPath;\n    installZipRecoveryExtractPath_ = zipRecoveryExtractPath;\n    installZipRecoveryMayBeCorrupt_ = zipRecoveryMayBeCorrupt;\n''', 'ui progress recovery state')

          # Controller input: intercept recovery before normal Square/Circle result handling.
          input_anchor = 'if(installProgressActive_&&(pressed&SCE_CTRL_SQUARE)'
          if input_anchor not in u:
              raise SystemExit('ui controller input anchor not found')
          recovery_input = r'''if(installProgressActive_&&installOutcome_==2&&installZipRecoveryAvailable_){
    if(pressed&SCE_CTRL_TRIANGLE){
        const bool ok=installZipRecovery_?installZipRecovery_(true):false;
        if(ok)showToast(::psvitaalive::L("ZIP_RECOVERY_KEPT"),3000);
        else showToast(::psvitaalive::L("ZIP_RECOVERY_KEEP_FAILED"),3400);
        return;
    }
    if(pressed&SCE_CTRL_CROSS){
        const bool ok=installZipRecovery_?installZipRecovery_(false):false;
        if(ok)showToast(::psvitaalive::L("ZIP_RECOVERY_DELETED"),2800);
        else showToast(::psvitaalive::L("ZIP_RECOVERY_DELETE_FAILED"),3400);
        return;
    }
    if(pressed&SCE_CTRL_SQUARE){
        trySendErrorReport("ZIP extraction failed",
            installProgressMessage_+" | file="+installProgressFile_+
            " | recovery="+installZipRecoveryPath_+
            " | extract_target="+installZipRecoveryExtractPath_);
        return;
    }
    if(pressed&SCE_CTRL_CIRCLE){
        showToast(::psvitaalive::L("ZIP_RECOVERY_CHOOSE_ACTION"),2800);
        return;
    }
    return;
}'''
          u = u.replace(input_anchor, recovery_input + input_anchor, 1)

          # Touch: three explicit recovery actions before generic error handling.
          touch_anchor = '''            if (installOutcome_ == 2) {\n                const bool spaceErr = isNonReportableInstallError(installProgressMessage_)\n'''
          touch_new = r'''            if (installOutcome_ == 2) {
                if (installZipRecoveryAvailable_) {
                    const int bw = 250, gap = 15;
                    const int totalW = bw * 3 + gap * 2;
                    const int bx0 = ox + (ow - totalW) / 2;
                    const int bx1 = bx0 + bw + gap;
                    const int bx2 = bx1 + bw + gap;
                    if (hit(x, y, bx0 - 8, resultBy - 8, bw + 16, bh + 16)) {
                        const bool ok = installZipRecovery_ ? installZipRecovery_(true) : false;
                        showToast(::psvitaalive::L(ok ? "ZIP_RECOVERY_KEPT" : "ZIP_RECOVERY_KEEP_FAILED"), 3200);
                        return;
                    }
                    if (hit(x, y, bx1 - 8, resultBy - 8, bw + 16, bh + 16)) {
                        const bool ok = installZipRecovery_ ? installZipRecovery_(false) : false;
                        showToast(::psvitaalive::L(ok ? "ZIP_RECOVERY_DELETED" : "ZIP_RECOVERY_DELETE_FAILED"), 3200);
                        return;
                    }
                    if (hit(x, y, bx2 - 8, resultBy - 8, bw + 16, bh + 16)) {
                        trySendErrorReport(
                            "ZIP extraction failed",
                            installProgressMessage_ + " | file=" + installProgressFile_ +
                            " | recovery=" + installZipRecoveryPath_ +
                            " | extract_target=" + installZipRecoveryExtractPath_);
                        return;
                    }
                    return;
                }
                const bool spaceErr = isNonReportableInstallError(installProgressMessage_)
'''
          u = repl(u, touch_anchor, touch_new, 'ui touch recovery')

          # Error result: recovery-specific panel before generic Install Failed panel.
          err_anchor = '''if(installOutcome_==2){\n  using TID = ::psvitaalive::TextId;\n'''
          err_panel = r'''if(installOutcome_==2){
  using TID = ::psvitaalive::TextId;
  if (installZipRecoveryAvailable_) {
    const unsigned amber = RGBA8(0xE0,0xA0,0x30,255);
    ::psvitaalive::ui::uiDrawText(&font_,x+28,y+72,amber,1.18f,::psvitaalive::L("ZIP_RECOVERY_TITLE"));
    ::psvitaalive::ui::uiDrawText(&font_,x+28,y+106,TEXT,0.72f,::psvitaalive::L("ZIP_RECOVERY_DOWNLOADED_OK"));

    std::string file=installProgressFile_.empty()?"archive.zip":ellipsize(installProgressFile_,52);
    char line[260];
    sceClibSnprintf(line,sizeof(line),"%s: %s",::psvitaalive::L(TID::LabelFile),file.c_str());
    ::psvitaalive::ui::uiDrawText(&font_,x+28,y+142,WHITE,0.78f,line);

    std::string recoveryDir=installZipRecoveryPath_;
    const size_t slash=recoveryDir.find_last_of('/');
    if(slash!=std::string::npos) recoveryDir.resize(slash+1);
    sceClibSnprintf(line,sizeof(line),"%s: %s",::psvitaalive::L("ZIP_RECOVERY_SAVED_AT"),ellipsize(recoveryDir,58).c_str());
    ::psvitaalive::ui::uiDrawText(&font_,x+28,y+176,ACCENT,0.72f,line);
    sceClibSnprintf(line,sizeof(line),"%s: %s",::psvitaalive::L("ZIP_RECOVERY_EXTRACT_TO"),
        installZipRecoveryExtractPath_.empty()?"-":ellipsize(installZipRecoveryExtractPath_,50).c_str());
    ::psvitaalive::ui::uiDrawText(&font_,x+28,y+208,TEXT,0.72f,line);

    const char* warning = installZipRecoveryMayBeCorrupt_
        ? ::psvitaalive::L("ZIP_RECOVERY_WARNING_CORRUPT")
        : ::psvitaalive::L("ZIP_RECOVERY_WARNING");
    ::psvitaalive::ui::uiDrawText(&font_,x+28,y+242,installZipRecoveryMayBeCorrupt_?amber:DIM,0.68f,
        ellipsize(warning,76).c_str());
    if(!installProgressMessage_.empty()){
      sceClibSnprintf(line,sizeof(line),"%s: %s",::psvitaalive::L(TID::LabelReason),ellipsize(installProgressMessage_,68).c_str());
      ::psvitaalive::ui::uiDrawText(&font_,x+28,y+278,DIM,0.64f,line);
    }

    const int by2=y+360,bh2=50,bw=250,gap=15,totalW=bw*3+gap*2;
    const int bx0=x+(w-totalW)/2,bx1=bx0+bw+gap,bx2=bx1+bw+gap;
    vita2d_draw_rectangle(bx0,by2,bw,bh2,ACCENT);
    vita2d_draw_rectangle(bx1,by2,bw,bh2,RED);
    const unsigned reportCol=(reportUiState_==2)?GREEN:RED;
    vita2d_draw_rectangle(bx2,by2,bw,bh2,reportCol);
    auto centered=[&](int bx,const char* text,unsigned color){
      float sc=0.58f;
      while(sc>0.46f && ::psvitaalive::ui::uiTextWidth(&font_,sc,text)>bw-14) sc-=0.02f;
      const int tw=::psvitaalive::ui::uiTextWidth(&font_,sc,text);
      ::psvitaalive::ui::uiDrawText(&font_,bx+(bw-tw)/2,by2+32,color,sc,text);
