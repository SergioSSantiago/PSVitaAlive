name: Apply ZIP extraction recovery once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-zip-recovery-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and run patch script
        shell: bash
        run: |
          set -euo pipefail
          git show a5bdd297c233f806e761c72399bccce0b3ae0847:.github/workflows/apply-zip-recovery-once.yml > /tmp/zip-old.yml
          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/zip-old.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          body = src[start:end]
          # The old workflow embedded Python in a YAML block. Remove the YAML
          # indentation from Python statements while preserving raw-string body
          # lines that intentionally began at column zero.
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_zip_recovery.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 -m py_compile /tmp/apply_zip_recovery.py
          python3 /tmp/apply_zip_recovery.py
          rm -f .github/workflows/apply-zip-recovery-once.yml
          git diff --check
          git status --short

      - name: Commit implementation to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add ZIP extraction recovery and manual keep/delete UX"
          git push origin HEAD:main
