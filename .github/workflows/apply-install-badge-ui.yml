name: Apply localized install badge UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-install-badge-ui.yml"

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact UI and localization patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Keep all existing TextId numeric values stable by appending the new key.
          replace_once(
              "Client PSVitaAlive/include/localization/localization.hpp",
              "    PspSetupLiveAreaBlocked,\n    Count\n};",
              "    PspSetupLiveAreaBlocked,\n    // Catalog card install/update badges (appended to preserve existing TextId ordinals)\n    BadgeUpdate,\n    Count\n};",
          )

          replace_once(
              "Client PSVitaAlive/source/localization/localization.cpp",
              '        case TextId::BadgeInstalled: return "BADGE_INSTALLED";\n        case TextId::MetaAlreadyInstalled: return "META_ALREADY_INSTALLED";',
              '        case TextId::BadgeInstalled: return "BADGE_INSTALLED";\n        case TextId::BadgeUpdate: return "BADGE_UPDATE";\n        case TextId::MetaAlreadyInstalled: return "META_ALREADY_INSTALLED";',
          )

          ui_path = "Client PSVitaAlive/source/ui/full_catalog_screen.cpp"

          old_badge = r'''void FullCatalogScreen::drawInstallBadge(int x, int y, const LocalInstallInfo& info, bool compact) {
              if (info.state != LocalInstallState::Installed && info.state != LocalInstallState::UpdateAvailable
                  && info.state != LocalInstallState::InstalledUnknown)
                  return;
              const bool upd = (info.state == LocalInstallState::UpdateAvailable);
              const bool unk = (info.state == LocalInstallState::InstalledUnknown);
              const char* label = upd ? (compact ? "UPD" : "UPDATE")
                               : (unk ? (compact ? "ON?" : "INSTALLED?") : (compact ? "ON" : "INSTALLED"));
              const unsigned bg = upd ? RGBA8(0xE0, 0x8A, 0x10, 255)
                              : (unk ? RGBA8(0x70, 0x78, 0x88, 255) : ACCENT);
              const unsigned fg = upd ? WHITE : BG;
              const float scale = compact ? 0.48f : 0.54f;
              const int tw = ::psvitaalive::ui::uiTextWidth(&font_, scale, label);
              const int padX = compact ? 5 : 7;
              const int bh = compact ? 16 : 18;
              const int bw = tw + padX * 2;
              vita2d_draw_rectangle(x, y, bw, bh, bg);
              ::psvitaalive::ui::uiDrawText(&font_, x + padX, y + (compact ? 12 : 13), fg, scale, label);
          }
          '''

          new_badge = r'''namespace {
          bool isInstallBadgeState(const LocalInstallInfo& info) {
              return info.state == LocalInstallState::Installed
                  || info.state == LocalInstallState::UpdateAvailable
                  || info.state == LocalInstallState::InstalledUnknown;
          }

          const char* installBadgeLabel(const LocalInstallInfo& info) {
              return info.state == LocalInstallState::UpdateAvailable
                  ? ::psvitaalive::L(::psvitaalive::TextId::BadgeUpdate)
                  : ::psvitaalive::L(::psvitaalive::TextId::BadgeInstalled);
          }

          int installBadgeWidth(const ::psvitaalive::ui::UiFont* font, const LocalInstallInfo& info, bool compact) {
              if (!font || !isInstallBadgeState(info)) return 0;
              const float scale = compact ? 0.48f : 0.50f;
              const int padX = compact ? 6 : 7;
              const int minW = compact ? 70 : 76;
              const int maxW = compact ? 124 : 112;
              const int tw = ::psvitaalive::ui::uiTextWidth(font, scale, installBadgeLabel(info));
              return std::max(minW, std::min(maxW, tw + padX * 2));
          }
          } // namespace

          void FullCatalogScreen::drawInstallBadge(int x, int y, const LocalInstallInfo& info, bool compact) {
              if (!isInstallBadgeState(info)) return;

              const bool upd = (info.state == LocalInstallState::UpdateAvailable);
              const bool unk = (info.state == LocalInstallState::InstalledUnknown);
              const char* label = installBadgeLabel(info);
              const unsigned bg = upd ? RGBA8(0xE0, 0x8A, 0x10, 255)
                                      : (unk ? RGBA8(0x70, 0x78, 0x88, 255) : ACCENT);
              const unsigned fg = upd ? WHITE : (unk ? WHITE : BG);
              const float scale = compact ? 0.48f : 0.50f;
              const int padX = compact ? 6 : 7;
              const int bh = compact ? 18 : 20;
              const int bw = installBadgeWidth(&font_, info, compact);
              const int tw = ::psvitaalive::ui::uiTextWidth(&font_, scale, label);
              const int innerW = std::max(8, bw - padX * 2);

              // The update badge never disappears: only its outer glow breathes softly.
              if (upd) {
                  const float pulse = focusPulse();
                  const unsigned a = static_cast<unsigned>(80.f + pulse * 150.f);
                  const unsigned glow = RGBA8(0xFF, 0xB4, 0x38, std::min(255u, a));
                  vita2d_draw_rectangle(x - 1, y - 1, bw + 2, 1, glow);
                  vita2d_draw_rectangle(x - 1, y + bh, bw + 2, 1, glow);
                  vita2d_draw_rectangle(x - 1, y - 1, 1, bh + 2, glow);
                  vita2d_draw_rectangle(x + bw, y - 1, 1, bh + 2, glow);
              }

              vita2d_draw_rectangle(x, y, bw, bh, bg);
              const int baselineY = y + (compact ? 13 : 14);
              if (tw <= innerW) {
                  ::psvitaalive::ui::uiDrawText(&font_, x + (bw - tw) / 2, baselineY, fg, scale, label);
              } else {
                  // Long translations scroll inside the badge instead of covering card metadata.
                  drawMarqueeText(&font_, x + padX, baselineY, innerW, fg, scale, label, true,
                                  x + padX, y, x + bw - padX, y + bh);
              }
          }
          '''
          replace_once(ui_path, old_badge, new_badge)

          old_name = r'''    const bool compact = h < 125;
              int is = compact ? 64 : 80;
              drawImage(!it.icon.empty() ? it.icon : it.cover, "app", x + 10 + ox, y + (compact ? 8 : 10) + oy, is, is);
              int tx = x + is + (compact ? 14 : 18) + ox;
              {
                  const float nameSc = compact ? (focus ? 0.90f : 0.84f) : (focus ? 0.98f : 0.92f);
                  // Reserve right side for Game/Data Files chips + size so title never underlaps.
                  // Let the title use the full right side unless an actual badge occupies it.
                  // The file badges are drawn lower in the card, so reserving 100+ px here
                  // unnecessarily made titles look cramped.
                  const int rightPad = compact ? 10 : 14;
                  const int nameMaxW = std::max(40, (x + ox + ww) - tx - rightPad);
                  drawMarqueeText(&font_, tx, y + (compact ? 24 : 28) + oy, nameMaxW, WHITE, nameSc, it.name, focus,
                                   clipL, clipT, clipR, clipB);
              }
          '''

          new_name = r'''    const bool compact = h < 125;
              int is = compact ? 64 : 80;
              drawImage(!it.icon.empty() ? it.icon : it.cover, "app", x + 10 + ox, y + (compact ? 8 : 10) + oy, is, is);

              // Probe once per card and reserve the top-right status badge before drawing the title.
              // This keeps localized status text from ever covering the app name.
              const LocalInstallInfo cardInstall = queryLocalInstall(it);
              const bool cardHasInstallBadge = isInstallBadgeState(cardInstall);
              const int cardInstallBadgeW = cardHasInstallBadge
                  ? installBadgeWidth(&font_, cardInstall, compact)
                  : 0;

              int tx = x + is + (compact ? 14 : 18) + ox;
              {
                  const float nameSc = compact ? (focus ? 0.90f : 0.84f) : (focus ? 0.98f : 0.92f);
                  const int rightPad = compact ? 10 : 14;
                  const int badgeReserve = cardHasInstallBadge ? (cardInstallBadgeW + 8) : 0;
                  const int nameMaxW = std::max(40, (x + ox + ww) - tx - rightPad - badgeReserve);
                  drawMarqueeText(&font_, tx, y + (compact ? 24 : 28) + oy, nameMaxW, WHITE, nameSc, it.name, focus,
                                   clipL, clipT, clipR, clipB);
              }
          '''
          replace_once(ui_path, old_name, new_name)

          old_card_badges = r'''    // Installed / update badge: bottom-left on icon + top-right of card
              {
                  const LocalInstallInfo li = queryLocalInstall(it);
                  if (li.state == LocalInstallState::Installed || li.state == LocalInstallState::UpdateAvailable || li.state == LocalInstallState::InstalledUnknown) {
                      // Overlay on icon corner (always visible even when title text is long)
                      drawInstallBadge(x + 10 + ox, y + 9 + oy + is - 18, li, true);
                      const char* lab = (li.state == LocalInstallState::UpdateAvailable) ? "UPD" : "ON";
                      const float sc = 0.56f;
                      const int tw = ::psvitaalive::ui::uiTextWidth(&font_, sc, lab);
                      const int bw = tw + 10;
                      drawInstallBadge(x + ox + ww - bw - 6, y + oy + 6, li, true);
                  }
              }
          '''

          new_card_badges = r'''    // Single localized install/update badge: top-right only.
              // The title width above already reserves this exact badge width.
              if (cardHasInstallBadge) {
                  drawInstallBadge(x + ox + ww - cardInstallBadgeW - 6, y + oy + 6, cardInstall, compact);
                  // A marquee inside the badge can tighten the scissor; restore the card clip.
                  vita2d_enable_clipping();
                  vita2d_set_clip_rectangle(std::max(x + ox, clipL), std::max(y + oy, clipT),
                                            std::min(x + ox + ww, clipR), std::min(y + oy + hh, clipB));
              }
          '''
          replace_once(ui_path, old_card_badges, new_card_badges)

          old_detail_badge = r'''        if (li.state == LocalInstallState::Installed || li.state == LocalInstallState::UpdateAvailable || li.state == LocalInstallState::InstalledUnknown) {
                      const char* lab = (li.state == LocalInstallState::UpdateAvailable) ? "UPDATE" : "INSTALLED";
                      const float sc = 0.54f;
                      const int tw = ::psvitaalive::ui::uiTextWidth(&font_, sc, lab);
                      const int bw = tw + 14;
                      drawInstallBadge(x + w - bw - 10, y + 12, li, false);
                      if (!li.installedVersion.empty()) {
          '''
          new_detail_badge = r'''        if (li.state == LocalInstallState::Installed || li.state == LocalInstallState::UpdateAvailable || li.state == LocalInstallState::InstalledUnknown) {
                      const int bw = installBadgeWidth(&font_, li, false);
                      drawInstallBadge(x + w - bw - 10, y + 12, li, false);
                      // Restore the detail-panel scissor if the localized badge is marqueeing.
                      vita2d_enable_clipping();
                      vita2d_set_clip_rectangle(x, y, x + w, y + h);
                      if (!li.installedVersion.empty()) {
          '''
          replace_once(ui_path, old_detail_badge, new_detail_badge)

          translations = {
              "en.lang": ("Installed", "UPDATE"),
              "es.lang": ("Instalado", "ACTUALIZACIÓN"),
              "fr.lang": ("Installé", "MISE À JOUR"),
              "de.lang": ("Installiert", "UPDATE"),
              "it.lang": ("Installato", "AGGIORNAMENTO"),
              "pt-PT.lang": ("Instalado", "ATUALIZAÇÃO"),
              "pt-BR.lang": ("Instalado", "ATUALIZAÇÃO"),
              "ru.lang": ("Установлено", "ОБНОВЛЕНИЕ"),
          }

          for name, (installed, update) in translations.items():
              p = Path("Client PSVitaAlive/assets/lang") / name
              lines = p.read_text(encoding="utf-8").splitlines()
              inst_indexes = [i for i, line in enumerate(lines) if line.startswith("BADGE_INSTALLED=")]
              if len(inst_indexes) != 1:
                  raise SystemExit(f"{p}: expected one BADGE_INSTALLED, found {len(inst_indexes)}")
              i = inst_indexes[0]
              lines[i] = f"BADGE_INSTALLED={installed}"
              upd_indexes = [j for j, line in enumerate(lines) if line.startswith("BADGE_UPDATE=")]
              if upd_indexes:
                  if len(upd_indexes) != 1:
                      raise SystemExit(f"{p}: duplicate BADGE_UPDATE")
                  lines[upd_indexes[0]] = f"BADGE_UPDATE={update}"
              else:
                  lines.insert(i + 1, f"BADGE_UPDATE={update}")
              p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          multilanguage = Path("docs/MULTILANGUAGE.md")
          ml = multilanguage.read_text(encoding="utf-8")
          section = r'''

          ## Catalog install/update badges

          Catalog cards expose one installation-state badge only, in the top-right corner. The old icon-corner duplicate is intentionally not rendered.

          The badge text is part of the client localization layer:

          ```text
          BADGE_INSTALLED
          BADGE_UPDATE
          ```

          `Installed` and `InstalledUnknown` both use `BADGE_INSTALLED` on compact catalog cards; the detailed information panel may still explain that the installed version is unknown. `UpdateAvailable` uses `BADGE_UPDATE`.

          Card layout reserves the computed badge width before drawing the app title. If either the app title or a localized badge does not fit its allotted width, the existing clipped marquee renderer is used instead of allowing text to overlap other metadata.

          The update badge keeps the existing orange warning identity and adds a lightweight breathing outer glow derived from the frame clock. The badge itself never disappears, no texture is allocated, and no additional worker/timer is created.
          '''
          if "## Catalog install/update badges" not in ml:
              multilanguage.write_text(ml.rstrip() + section + "\n", encoding="utf-8")

          update_doc = Path("docs/UPDATE_DETECTION.md")
          ud = update_doc.read_text(encoding="utf-8")
          section2 = r'''

          ## Catalog card presentation

          Update detection and card presentation remain separate concerns. `queryLocalInstall()` / `decideInstallState()` continue to determine the state; the catalog renderer only presents that result.

          - `Installed` → one localized `BADGE_INSTALLED` badge at the top-right.
          - `InstalledUnknown` → the same installed badge on the card; detailed metadata keeps the version-unknown explanation.
          - `UpdateAvailable` → one localized `BADGE_UPDATE` badge at the top-right with a subtle orange breathing glow.
          - `NotInstalled` / `Unknown` → no card badge.

          The previous second badge over the lower-left icon corner and the hardcoded `ON` / `UPD` abbreviations were removed. Card title width now reserves the badge area, and long localized text uses clipping/marquee rather than overlapping app information.
          '''
          if "## Catalog card presentation" not in ud:
              update_doc.write_text(ud.rstrip() + section2 + "\n", encoding="utf-8")

          # Guardrails: verify the requested behavior and that old hardcoded card labels are gone.
          ui = Path(ui_path).read_text(encoding="utf-8")
          required = [
              "TextId::BadgeUpdate",
              "cardInstallBadgeW",
              "Single localized install/update badge: top-right only.",
              "The update badge never disappears",
          ]
          for needle in required:
              if needle not in ui:
                  raise SystemExit(f"UI validation missing: {needle}")
          forbidden = [
              'compact ? "UPD" : "UPDATE"',
              'compact ? "ON" : "INSTALLED"',
              'drawInstallBadge(x + 10 + ox, y + 9 + oy + is - 18',
              'const char* lab = (li.state == LocalInstallState::UpdateAvailable) ? "UPD" : "ON"',
          ]
          for needle in forbidden:
              if needle in ui:
                  raise SystemExit(f"Old badge implementation still present: {needle}")

          hpp = Path("Client PSVitaAlive/include/localization/localization.hpp").read_text(encoding="utf-8")
          loc = Path("Client PSVitaAlive/source/localization/localization.cpp").read_text(encoding="utf-8")
          if hpp.count("BadgeUpdate,") != 1 or loc.count('TextId::BadgeUpdate: return "BADGE_UPDATE"') != 1:
              raise SystemExit("BadgeUpdate TextId mapping validation failed")

          for name in translations:
              text = (Path("Client PSVitaAlive/assets/lang") / name).read_text(encoding="utf-8")
              if text.count("BADGE_UPDATE=") != 1 or text.count("BADGE_INSTALLED=") != 1:
                  raise SystemExit(f"{name}: badge localization validation failed")

          print("Localized install/update badge patch validated")
          PY

      - name: Diff validation
        run: |
          git diff --check
          git diff --stat
          git diff -- "Client PSVitaAlive/source/ui/full_catalog_screen.cpp" \
                     "Client PSVitaAlive/include/localization/localization.hpp" \
                     "Client PSVitaAlive/source/localization/localization.cpp" \
                     "Client PSVitaAlive/assets/lang" \
                     "docs/MULTILANGUAGE.md" \
                     "docs/UPDATE_DETECTION.md"

      - name: Commit patch to main
        run: |
          git config user.name "PSVitaAlive Automation"
          git config user.email "actions@users.noreply.github.com"
          git add "Client PSVitaAlive/source/ui/full_catalog_screen.cpp" \
                  "Client PSVitaAlive/include/localization/localization.hpp" \
                  "Client PSVitaAlive/source/localization/localization.cpp" \
                  "Client PSVitaAlive/assets/lang" \
                  "docs/MULTILANGUAGE.md" \
                  "docs/UPDATE_DETECTION.md"
          git commit -m "feat: simplify localized install and update badges"
          git push origin HEAD:main
