name: Apply detail link controls

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-detail-link-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply minimal detail navigation change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cpp_path = Path('Client PSVitaAlive/source/ui/full_catalog_screen.cpp')
          text = cpp_path.read_text(encoding='utf-8')

          old_circle = 'if(state_.mode!=UiMode::SPLIT_DETAIL)return;if(pressed&SCE_CTRL_CIRCLE){startClosingDetail();return;}'
          new_circle = 'if(state_.mode!=UiMode::SPLIT_DETAIL)return;if(pressed&SCE_CTRL_CIRCLE){if(state_.linkNavigation){exitLinkNavigation();return;}startClosingDetail();return;}'
          if text.count(old_circle) != 1:
              raise SystemExit(f'Expected exactly one detail Circle block, found {text.count(old_circle)}')
          text = text.replace(old_circle, new_circle, 1)

          old_toggle = 'if(pressed&SCE_CTRL_TRIANGLE){if(state_.linkNavigation)exitLinkNavigation();else enterLinkNavigation();return;}'
          new_enter = 'if(!state_.linkNavigation&&(pressed&SCE_CTRL_CROSS)){enterLinkNavigation();return;}'
          if text.count(old_toggle) != 1:
              raise SystemExit(f'Expected exactly one Triangle link-navigation toggle, found {text.count(old_toggle)}')
          text = text.replace(old_toggle, new_enter, 1)

          if old_toggle in text:
              raise SystemExit('Triangle link-navigation toggle still present after patch')
          if new_circle not in text or new_enter not in text:
              raise SystemExit('Post-patch detail navigation checks failed')

          cpp_path.write_text(text, encoding='utf-8')

          lang_dir = Path('Client PSVitaAlive/assets/lang')
          changed_langs = []
          for lang_path in sorted(lang_dir.glob('*.lang')):
              lines = lang_path.read_text(encoding='utf-8').splitlines()
              changed = False
              out = []
              for line in lines:
                  if line.startswith('SELECT_LINKS='):
                      value = line.split('=', 1)[1]
                      for old_prefix in ('△ ', 'X ', 'O '):
                          if value.startswith(old_prefix):
                              value = value[len(old_prefix):]
                              break
                      line = 'SELECT_LINKS=X ' + value
                      changed = True
                  elif line.startswith('EXIT_LINK_MODE='):
                      value = line.split('=', 1)[1]
                      for old_prefix in ('△ ', 'X ', 'O '):
                          if value.startswith(old_prefix):
                              value = value[len(old_prefix):]
                              break
                      line = 'EXIT_LINK_MODE=O ' + value
                      changed = True
                  out.append(line)
              if changed:
                  lang_path.write_text('\n'.join(out) + '\n', encoding='utf-8')
                  changed_langs.append(lang_path.name)

          if not changed_langs:
              raise SystemExit('No language files contained SELECT_LINKS/EXIT_LINK_MODE')

          print('Updated input routing:', cpp_path)
          print('Updated language files:', ', '.join(changed_langs))
          PY

          git diff --check
          git diff -- 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp' 'Client PSVitaAlive/assets/lang'

      - name: Commit change to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp' 'Client PSVitaAlive/assets/lang'
          git commit -m 'Use X/O for detail link navigation'
          git push origin HEAD:main
