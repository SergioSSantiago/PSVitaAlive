name: Apply left stick navigation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-left-stick-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply left-stick navigation support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Client PSVitaAlive/source/ui/full_catalog_screen.cpp')
          text = path.read_text(encoding='utf-8')

          # Shared left-stick -> virtual D-pad helper. Values are 0..255, centered near 128.
          # 64/192 gives a generous dead zone so normal stick drift cannot navigate the UI.
          anchor = '''inline void finishFrameWithCommonDialog() {
              vita2d_end_drawing();
              vita2d_common_dialog_update();
              vita2d_swap_buffers();
          }
          '''
          helper = '''inline void finishFrameWithCommonDialog() {
              vita2d_end_drawing();
              vita2d_common_dialog_update();
              vita2d_swap_buffers();
          }

          constexpr uint32_t NAV_DIRECTION_MASK =
              SCE_CTRL_UP | SCE_CTRL_DOWN | SCE_CTRL_LEFT | SCE_CTRL_RIGHT;

          uint32_t leftStickNavMask(const SceCtrlData& pad) {
              constexpr uint8_t LOW = 64;
              constexpr uint8_t HIGH = 192;
              uint32_t nav = 0;
              if (pad.lx <= LOW) nav |= SCE_CTRL_LEFT;
              else if (pad.lx >= HIGH) nav |= SCE_CTRL_RIGHT;
              if (pad.ly <= LOW) nav |= SCE_CTRL_UP;
              else if (pad.ly >= HIGH) nav |= SCE_CTRL_DOWN;
              return nav;
          }
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'finishFrame anchor count={text.count(anchor)}')
          text = text.replace(anchor, helper, 1)

          # Enable analog samples once for the whole UI. ANALOG mode still includes digital buttons.
          old_start = '''void FullCatalogScreen::handleInput(){
              if (externalInputBlocked_) return;
          '''
          new_start = '''void FullCatalogScreen::handleInput(){
              if (externalInputBlocked_) return;
              static bool analogSamplingEnabled = false;
              if (!analogSamplingEnabled) {
                  sceCtrlSetSamplingMode(SCE_CTRL_MODE_ANALOG);
                  analogSamplingEnabled = true;
              }
          '''
          if text.count(old_start) != 1:
              raise SystemExit(f'handleInput start count={text.count(old_start)}')
          text = text.replace(old_start, new_start, 1)

          # Essential-plugins modal: one-shot left/right, matching its existing D-pad semantics.
          old_ess = '''        static uint32_t prevButtonsEss = 0;
                  const uint32_t pressed = pad.buttons & ~prevButtonsEss;
                  prevButtonsEss = pad.buttons;
                  if (pressed & SCE_CTRL_LEFT) essentialPluginsFocus_ = 0;
                  if (pressed & SCE_CTRL_RIGHT) essentialPluginsFocus_ = 1;
          '''
          new_ess = '''        static uint32_t prevButtonsEss = 0;
                  static uint32_t prevAnalogEss = 0;
                  const uint32_t pressed = pad.buttons & ~prevButtonsEss;
                  const uint32_t analog = leftStickNavMask(pad);
                  const uint32_t navPressed = (pressed & NAV_DIRECTION_MASK) | (analog & ~prevAnalogEss);
                  prevButtonsEss = pad.buttons;
                  prevAnalogEss = analog;
                  if (navPressed & SCE_CTRL_LEFT) essentialPluginsFocus_ = 0;
                  if (navPressed & SCE_CTRL_RIGHT) essentialPluginsFocus_ = 1;
          '''
          if text.count(old_ess) != 1:
              raise SystemExit(f'essential modal block count={text.count(old_ess)}')
          text = text.replace(old_ess, new_ess, 1)

          # PSP setup wizard: one-shot stick directions, same as current D-pad handling.
          old_psp_head = '''        static uint32_t prevButtonsPsp = 0;
                  const uint32_t pressed = pad.buttons & ~prevButtonsPsp;
                  prevButtonsPsp = pad.buttons;
                  if (pressed & SCE_CTRL_CIRCLE) { closePspSetupWizard(false); return; }
                  if (pressed & SCE_CTRL_LEFT) {
          '''
          new_psp_head = '''        static uint32_t prevButtonsPsp = 0;
                  static uint32_t prevAnalogPsp = 0;
                  const uint32_t pressed = pad.buttons & ~prevButtonsPsp;
                  const uint32_t analog = leftStickNavMask(pad);
                  const uint32_t navPressed = (pressed & NAV_DIRECTION_MASK) | (analog & ~prevAnalogPsp);
                  prevButtonsPsp = pad.buttons;
                  prevAnalogPsp = analog;
                  if (pressed & SCE_CTRL_CIRCLE) { closePspSetupWizard(false); return; }
                  if (navPressed & SCE_CTRL_LEFT) {
          '''
          if text.count(old_psp_head) != 1:
              raise SystemExit(f'psp modal head count={text.count(old_psp_head)}')
          text = text.replace(old_psp_head, new_psp_head, 1)

          for old, new, label in [
              ('        if (pressed & SCE_CTRL_RIGHT) {\n', '        if (navPressed & SCE_CTRL_RIGHT) {\n', 'psp right'),
              ('        if (pressed & SCE_CTRL_UP) {\n', '        if (navPressed & SCE_CTRL_UP) {\n', 'psp up'),
              ('        if (pressed & SCE_CTRL_DOWN) {\n', '        if (navPressed & SCE_CTRL_DOWN) {\n', 'psp down'),
          ]:
              # Limit each replacement to the PSP wizard section before the main nav block.
              psp_start = text.index('if (pspSetupModal_)')
              main_start = text.index('if(isTransitioning())return;', psp_start)
              segment = text[psp_start:main_start]
              if segment.count(old) != 1:
                  raise SystemExit(f'{label} count in PSP section={segment.count(old)}')
              segment = segment.replace(old, new, 1)
              text = text[:psp_start] + segment + text[main_start:]

          # Main navigation: merge physical D-pad and left-stick directions, preserving
          # the existing initial delay + repeat interval. Action buttons remain physical-only.
          old_nav = '''if(isTransitioning())return;SceCtrlData p{};sceCtrlPeekBufferPositive(0,&p,1);static uint32_t prev=0;static uint64_t repeatAt=0;uint32_t mask=SCE_CTRL_UP|SCE_CTRL_DOWN|SCE_CTRL_LEFT|SCE_CTRL_RIGHT,pressed=p.buttons&~prev,direct=pressed&mask;uint64_t now=sceKernelGetProcessTimeWide(),repeat=0;verticalNavHeld_=(p.buttons&(SCE_CTRL_UP|SCE_CTRL_DOWN))!=0;if(verticalNavHeld_)imageWorkResumeAfterUs_=now+IMAGE_NAV_RELEASE_GRACE_US;if((p.buttons&mask)==0)repeatAt=0;else if(direct)repeatAt=now+DIRECTION_REPEAT_DELAY_US;else if(repeatAt&&now>=repeatAt){repeat=p.buttons&mask;repeatAt=now+DIRECTION_REPEAT_INTERVAL_US;}prev=p.buttons;uint32_t nav=direct|repeat;if(gProtectionActive&&pressed!=0){protectionDismiss();return;}'''
          new_nav = '''if(isTransitioning())return;SceCtrlData p{};sceCtrlPeekBufferPositive(0,&p,1);static uint32_t prev=0;static uint32_t prevAnalog=0;static uint64_t repeatAt=0;const uint32_t analogNav=leftStickNavMask(p);const uint32_t heldNav=(p.buttons&NAV_DIRECTION_MASK)|analogNav;uint32_t pressed=p.buttons&~prev,direct=(pressed&NAV_DIRECTION_MASK)|(analogNav&~prevAnalog);uint64_t now=sceKernelGetProcessTimeWide(),repeat=0;verticalNavHeld_=(heldNav&(SCE_CTRL_UP|SCE_CTRL_DOWN))!=0;if(verticalNavHeld_)imageWorkResumeAfterUs_=now+IMAGE_NAV_RELEASE_GRACE_US;if(heldNav==0)repeatAt=0;else if(direct)repeatAt=now+DIRECTION_REPEAT_DELAY_US;else if(repeatAt&&now>=repeatAt){repeat=heldNav;repeatAt=now+DIRECTION_REPEAT_INTERVAL_US;}prev=p.buttons;prevAnalog=analogNav;uint32_t nav=direct|repeat;if(gProtectionActive&&(pressed!=0||direct!=0)){protectionDismiss();return;}'''
          if text.count(old_nav) != 1:
              raise SystemExit(f'main navigation block count={text.count(old_nav)}')
          text = text.replace(old_nav, new_nav, 1)

          # Split-detail panel switching must also consume virtual navigation.
          old_panel = 'if(state_.activePanel==UiPanel::Catalog){if(pressed&SCE_CTRL_RIGHT)state_.activePanel=UiPanel::Detail;'
          new_panel = 'if(state_.activePanel==UiPanel::Catalog){if(nav&SCE_CTRL_RIGHT)state_.activePanel=UiPanel::Detail;'
          if text.count(old_panel) != 1:
              raise SystemExit(f'detail panel switch count={text.count(old_panel)}')
          text = text.replace(old_panel, new_panel, 1)

          # Sanity checks.
          required = [
              'uint32_t leftStickNavMask(const SceCtrlData& pad)',
              'sceCtrlSetSamplingMode(SCE_CTRL_MODE_ANALOG);',
              'const uint32_t heldNav=(p.buttons&NAV_DIRECTION_MASK)|analogNav;',
              'if(state_.activePanel==UiPanel::Catalog){if(nav&SCE_CTRL_RIGHT)',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'missing post-patch check: {needle}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'

      - name: Commit change to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
          git commit -m 'Add left stick UI navigation'
          git push origin HEAD:main
