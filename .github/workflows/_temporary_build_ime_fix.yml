name: Temporary VitaSDK IME Build Check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary_build_ime_fix.yml'

permissions:
  contents: write

jobs:
  build-client:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure and build PSVitaAlive client
        shell: bash
        run: |
          set -euo pipefail
          cd 'Client PSVitaAlive'
          rm -rf ci-build
          cmake -S . -B ci-build
          cmake --build ci-build -j2

      - name: Remove temporary build workflow
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_temporary_build_ime_fix.yml
          git add .github/workflows/_temporary_build_ime_fix.yml
          git commit -m 'chore: remove temporary VitaSDK IME build check'
          git push origin HEAD:main
