name: Apply OLED Protection Mode

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_oled_protection_mode.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Implement OLED protection mode'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply OLED protection patch
        run: python scripts/apply_oled_protection_mode.py

      - name: Sanity checks
        shell: bash
        run: |
          python -m py_compile scripts/apply_oled_protection_mode.py
          git diff --check
          grep -q 'kProtectionDelayMs' 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
          grep -q 'PROTECTION_PRESS_ANY_BUTTON' 'Client PSVitaAlive/assets/lang/es.lang'
          test -f 'Client PSVitaAlive/docs/OLED_PROTECTION_MODE.md'

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp' \
                  'Client PSVitaAlive/assets/lang' \
                  'Client PSVitaAlive/docs/OLED_PROTECTION_MODE.md'
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Implement OLED protection mode'
          git push origin HEAD:main
