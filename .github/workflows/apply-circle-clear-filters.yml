name: Apply Circle filter clear

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-circle-clear-filters.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move full-catalog filter clear from Square to Circle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Client PSVitaAlive/source/ui/full_catalog_screen.cpp')
          text = path.read_text(encoding='utf-8')

          old_square = '''if(pressed&SCE_CTRL_SQUARE){if(state_.mode==UiMode::FULL_CATALOG){if(!searchQuery_.empty()||dataFilesFilter_){dataFilesFilter_=false;applySearch("");showToast(::psvitaalive::L(::psvitaalive::TextId::ToastFiltersCleared),1200);}return;}if(state_.mode==UiMode::SPLIT_DETAIL&&state_.activePanel==UiPanel::Detail&&!state_.linkNavigation){const int si=selectedIndex();if(si>=0&&itemEligibleForDataRequest(catalogView()[si])){openDataRequestConfirm();return;}}return;}'''
          new_square = '''if(pressed&SCE_CTRL_SQUARE){if(state_.mode==UiMode::SPLIT_DETAIL&&state_.activePanel==UiPanel::Detail&&!state_.linkNavigation){const int si=selectedIndex();if(si>=0&&itemEligibleForDataRequest(catalogView()[si])){openDataRequestConfirm();return;}}return;}'''
          if text.count(old_square) != 1:
              raise SystemExit(f'Expected exactly one Square filter block, found {text.count(old_square)}')
          text = text.replace(old_square, new_square, 1)

          old_full = '''if(state_.mode==UiMode::FULL_CATALOG){if(pressed&SCE_CTRL_TRIANGLE){if(searchRequest_)searchRequest_(searchQuery_);return;}'''
          new_full = '''if(state_.mode==UiMode::FULL_CATALOG){if(pressed&SCE_CTRL_CIRCLE){if(!searchQuery_.empty()||dataFilesFilter_){dataFilesFilter_=false;applySearch("");showToast(::psvitaalive::L(::psvitaalive::TextId::ToastFiltersCleared),1200);}return;}if(pressed&SCE_CTRL_TRIANGLE){if(searchRequest_)searchRequest_(searchQuery_);return;}'''
          if text.count(old_full) != 1:
              raise SystemExit(f'Expected exactly one FULL_CATALOG input block, found {text.count(old_full)}')
          text = text.replace(old_full, new_full, 1)

          # Ensure Detail Circle behavior is unchanged.
          detail_circle = '''if(state_.mode!=UiMode::SPLIT_DETAIL)return;if(pressed&SCE_CTRL_CIRCLE){if(state_.linkNavigation){exitLinkNavigation();return;}startClosingDetail();return;}'''
          if text.count(detail_circle) != 1:
              raise SystemExit('Detail Circle behavior was not found unchanged')

          # Sanity checks: full clear is now on Circle, Square still owns Request Data in Detail.
          if 'if(state_.mode==UiMode::FULL_CATALOG){if(pressed&SCE_CTRL_CIRCLE){if(!searchQuery_.empty()||dataFilesFilter_)' not in text:
              raise SystemExit('FULL_CATALOG Circle clear behavior missing')
          if 'if(pressed&SCE_CTRL_SQUARE){if(state_.mode==UiMode::SPLIT_DETAIL&&state_.activePanel==UiPanel::Detail&&!state_.linkNavigation)' not in text:
              raise SystemExit('Detail Square Request Data behavior missing')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'

      - name: Commit change to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
          git commit -m 'Use Circle to clear full-catalog filters'
          git push origin HEAD:main
