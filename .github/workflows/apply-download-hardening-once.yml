name: Apply Download Hardening Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-download-hardening-once.yml"

permissions:
  contents: write

concurrency:
  group: psvitaalive-download-hardening-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate phase-2 patch script
        run: python -m py_compile scripts/apply_download_stack_hardening_phase2.py

      - name: Apply second-stage download resilience hardening
        run: python scripts/apply_download_stack_hardening_phase2.py

      - name: Static sanity checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q "transferProgressCallback" "Client PSVitaAlive/source/network/http_client.cpp"
          grep -q "CURLOPT_PROTOCOLS_STR" "Client PSVitaAlive/source/network/http_client.cpp"
          grep -q "archiveTransportFailure" "Client PSVitaAlive/source/network/http_client.cpp"
          grep -q "archive failover switch HTTP=" "Client PSVitaAlive/source/network/http_client.cpp"
          grep -q "zip_compression_method_supported" "Client PSVitaAlive/source/archive/zip_extractor.cpp"

      - name: Commit hardened sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "Client PSVitaAlive/source/network/http_client.cpp" \
            "Client PSVitaAlive/source/archive/zip_extractor.cpp" \
            docs/NETWORK_TLS.md
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Strengthen stalled-transfer cancel and Archive failover"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main && git push origin HEAD:main; then
              echo "Phase-2 hardening commit pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort || true
            sleep 3
          done
          echo "::error::failed to push phase-2 hardening commit"
          exit 1
